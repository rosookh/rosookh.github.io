<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F5D50">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="assets/rz.css">
<script src="assets/rz.js"></script>
<script src="assets/lessons.js"></script>
<title>تقدّمي · رسوخ</title>
<style>
.lvhero{position:relative;overflow:hidden;background:#2F5D50;color:#F4EDE0;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.lvhero>*{position:relative}
.lvhero .rz-bar{background:rgba(244,237,224,.25)} .lvhero .rz-bar i{background:#C9AE8E}
.big-medal{width:64px;height:64px;font-size:26px}
.tiers{display:flex;justify-content:space-between;gap:4px}
.tiers span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;opacity:.55}
.tiers span.on{opacity:1}
.tiers .rz-medal{width:28px;height:28px}
.cmp{font-size:13px;font-weight:600}
.up{color:var(--good-ink)} .down{color:var(--bad-ink)}
.chs{display:flex;flex-direction:column;gap:8px}
</style>
</head><body data-nav="progress">
<main class="rz-main" id="app">
  <h1 class="rz-title">تقدّمي</h1>
</main>
<script>
(function(){
  const AR = RZ.AR, app = document.getElementById('app');
  const h = (t, a = {}, html = '') => { const e = document.createElement(t); Object.entries(a).forEach(([k, v]) => e.setAttribute(k, v)); e.innerHTML = html; return e; };
  const CH = {}; RZ_LESSONS.forEach(L => L.ch.forEach(c => CH[c.id] = c.t));
  const L = RZ.level(), G = RZ.game, today = RZ.today(), s = RZ.streak();

  // level card
  const lv = h('section', { class:'lvhero' });
  RZ.pattern(lv, { w:420, h:260, seed:7 });
  lv.append(h('div', { class:'rz-row' }, `<span class="rz-medal big-medal m-${L.cls}">${AR(L.step)}</span><div style="display:flex;flex-direction:column"><span style="font-size:13px;opacity:.85">مستواك</span><b style="font-size:26px;line-height:1.3">${L.name}</b><span style="font-size:13px;opacity:.85">${AR(L.xp)} نقطة</span></div>`),
    h('div', { class:'rz-bar' }, `<i style="width:${Math.round(L.pct * 100)}%"></i>`),
    h('span', { style:'font-size:13px;opacity:.9' }, L.next != null ? 'باقي ' + RZ.count(L.left, RZ.PT_FORMS) + ' على ' + L.nextName : 'وصلت إلى أعلى مستوى، ما شاء الله'),
    h('div', { class:'tiers' }, RZ.TIERS.map(([c, t], k) => `<span class="${L.i >= k * 3 ? 'on' : ''}"><i class="rz-medal m-${c}"></i>${t}</span>`).join('')));
  app.append(lv);

  // this week (Saturday → Friday)
  const now = new Date(); const dow = (now.getDay() + 1) % 7; // Saturday = 0
  const start = RZ.addDays(today, -dow);
  const days = [...Array(7)].map((_, i) => RZ.addDays(start, i));
  const prev = [...Array(7)].map((_, i) => RZ.addDays(start, i - 7));
  const sum = (ks, f) => ks.reduce((a, k) => a + ((G.log[k] || {})[f] || 0), 0);
  const active = ks => ks.filter(k => (G.log[k] || {}).x > 0 || (G.log[k] || {}).a > 0).length;
  const wC = sum(days, 'c'), wA = sum(days, 'a'), pC = sum(prev, 'c'), pA = sum(prev, 'a');
  const max = Math.max(5, ...days.map(k => (G.log[k] || {}).c || 0));
  const names = ['سبت', 'أحد', 'اثنين', 'ثلاثاء', 'أربعاء', 'خميس', 'جمعة'];
  const chart = days.map((k, i) => { const c = (G.log[k] || {}).c || 0;
    return `<div class="col"><span class="v">${c ? AR(c) : ''}</span><div class="bar${k === today ? ' today' : ''}${c ? '' : ' zero'}" style="height:${Math.max(4, Math.round(100 * c / max))}%"></div><small>${names[i]}</small></div>`; }).join('');
  const pct = wA ? Math.round(100 * wC / wA) : 0, ppct = pA ? Math.round(100 * pC / pA) : null;
  let cmp = '';
  if(pA){ const dlt = wC - pC; cmp = dlt > 0 ? `<span class="cmp up">↑ ${AR(dlt)} إجابة صحيحة أكثر من الأسبوع الماضي</span>` : dlt < 0 ? `<span class="cmp down">↓ ${AR(-dlt)} أقل من الأسبوع الماضي</span>` : '<span class="cmp">مثل الأسبوع الماضي</span>'; }
  const week = h('section', { class:'rz-card' }, `<div class="rz-between"><b>هذا الأسبوع</b><span class="rz-meta">${RZ.dateAR(days[0])} – ${RZ.dateAR(days[6])}</span></div>
    <span class="rz-meta">الإجابات الصحيحة في كل يوم</span>
    <div class="rz-chart" role="img" aria-label="الإجابات الصحيحة في أيام الأسبوع">${chart}</div>
    <div class="rz-stats"><div class="rz-stat"><b>${AR(active(days))}</b><small>من ٧ أيام دخلت فيها</small></div><div class="rz-stat"><b>${AR(wC)}</b><small>إجابة صحيحة</small></div><div class="rz-stat"><b>${AR(pct)}٪</b><small>نسبة الصواب${ppct != null ? ' (الماضي ' + AR(ppct) + '٪)' : ''}</small></div></div>
    ${cmp}`);
  app.append(week);

  // strongest / weakest chapter this week (fallback: last 30 days)
  const agg = ks => { const o = {}; ks.forEach(k => Object.entries((G.log[k] || {}).ch || {}).forEach(([c, [a, ok]]) => { const x = o[c] || (o[c] = [0, 0]); x[0] += a; x[1] += ok; })); return o; };
  let A = agg(days); if(Object.values(A).filter(x => x[0] >= 3).length < 2) A = agg([...Array(30)].map((_, i) => RZ.addDays(today, -i)));
  const ranked = Object.entries(A).filter(([, x]) => x[0] >= 3).map(([c, x]) => [c, x[1] / x[0], x[0]]).sort((a, b) => b[1] - a[1]);
  if(ranked.length >= 2){
    const best = ranked[0], worst = ranked[ranked.length - 1];
    app.append(h('section', { class:'rz-card' }, `<b>أبوابك</b><div class="chs">
      <div class="rz-between"><span>💪 أقوى باب: ${CH[best[0]] || ''}</span><span class="rz-badge plain">${AR(Math.round(best[1] * 100))}٪</span></div>
      <div class="rz-between"><span>🎯 يحتاج تقوية: ${CH[worst[0]] || ''}</span><span class="rz-badge bad">${AR(Math.round(worst[1] * 100))}٪</span></div></div>
      <a class="rz-btn pri block" href="library/#/strengthen/${worst[0]}">قوِّ أضعف باب</a>`));
  }

  // streak
  app.append(h('section', { class:'rz-card' }, `<div class="rz-between"><b>سلسلتك</b><span class="rz-badge">🔥 ${s.count ? RZ.count(s.count, RZ.DAY_FORMS) : 'لم تبدأ بعد'}</span></div>
    <span class="rz-meta">تكبر السلسلة كل يوم تحقّق فيه هدفك اليومي أو تُتمّ تحدّي اليوم.</span>
    <div class="rz-between"><span>أيام العذر المحفوظة: ${AR(s.freeze)} من ٢</span><span class="rz-meta">تُكسب كل ٧ أيام متتالية</span></div>
    ${s.vac ? `<span class="rz-badge plain">وضع الإجازة حتى ${RZ.dateAR(s.vac.to)}</span>` : ''}`));

  // month calendar
  const [y, m] = today.split('-').map(Number); const first = `${y}-${String(m).padStart(2, '0')}-01`;
  const nDays = new Date(y, m, 0).getDate(); const lead = (new Date(y, m - 1, 1).getDay() + 1) % 7;
  const sk = RZ.ls.get('rz-streak', {}); const vac = sk.vac;
  let cells = names.map(n => `<span class="h">${n.slice(0, 2)}</span>`).join('') + '<span class="h"></span>'.repeat(lead);
  let activeDays = 0;
  for(let dd = 1; dd <= nDays; dd++){
    const k = RZ.addDays(first, dd - 1), c = (G.log[k] || {}).c || 0, x = (G.log[k] || {}).x || 0;
    const lvC = x <= 0 ? '' : c >= 20 ? 'l3' : c >= 8 ? 'l2' : 'l1'; if(x > 0) activeDays++;
    const isVac = vac && vac.from <= k && k <= vac.to && !lvC;
    cells += `<span class="${lvC}${isVac ? ' vac' : ''}${k === today ? ' today' : ''}" title="${RZ.dateAR(k)}">${AR(dd)}</span>`;
  }
  app.append(h('section', { class:'rz-card' }, `<div class="rz-between"><b>تقويم الشهر</b><span class="rz-meta">${RZ.count(activeDays, RZ.DAY_FORMS)} نشاط</span></div>
    <div class="rz-cal">${cells}</div>
    <div class="legend" style="display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)"><span>كلما كان اللون أغمق زادت الإجابات الصحيحة</span>${vac ? '<span style="color:var(--accent-ink)">■ إجازة</span>' : ''}</div>`));

  // badges
  const got = RZ.BADGES.filter(b => G.badges['got_' + b.id]).length;
  app.append(h('section', { class:'rz-card' }, `<div class="rz-between"><b>أوسمتي</b><span class="rz-meta">${AR(got)} من ${AR(RZ.BADGES.length)}</span></div>
    <div class="rz-badges">${RZ.BADGES.map(b => `<div class="rz-bdg${G.badges['got_' + b.id] ? ' on' : ''}"><span class="e">${b.e}</span><b>${b.t}</b><span>${b.s}</span></div>`).join('')}</div>`));

  // totals
  const tot = Object.values(G.log).reduce((a, x) => [a[0] + x.a, a[1] + x.c], [0, 0]);
  app.append(h('section', { class:'rz-card' }, `<b>منذ البداية</b><div class="rz-stats"><div class="rz-stat"><b>${AR(tot[1])}</b><small>إجابة صحيحة</small></div><div class="rz-stat"><b>${AR(G.quizzes)}</b><small>اختباراً أنهيته</small></div><div class="rz-stat"><b>${AR(G.best60 || 0)}</b><small>رقمك في الجولة السريعة</small></div></div>`));
  RZ.checkBadges();
})();
</script>
</body></html>
