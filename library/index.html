<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F5D50">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../assets/rz.css">
<script src="../assets/rz.js"></script>
<title>مكتبة الاختبارات · رسوخ</title>
<style>
.ic{display:inline-flex;width:18px;height:18px;flex-shrink:0}
.ic svg{width:100%;height:100%}
.ic.acc{color:var(--accent-ink)}
.chev{display:flex;width:20px;height:20px;color:var(--muted)}
.chev svg{width:20px;height:20px}
.lvl{display:flex;flex-direction:column;gap:10px}
.chap{cursor:pointer;font:inherit}
.stars{color:var(--accent);letter-spacing:2px;font-size:15px;margin-top:auto}
.stars .off{color:var(--line-strong)}

/* builder tree */
.tree{display:flex;flex-direction:column;gap:8px}
.tl{border:1px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--bg)}
.tl summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
.tc{display:flex;flex-direction:column;gap:2px;padding:6px 0 10px;border-top:1px dashed var(--line)}
.tch,.tlsn{display:flex;align-items:center;gap:10px;min-height:40px}
.tch{font-weight:600}
.tlsn{padding-inline-start:26px;color:var(--ink)}
.tree input{width:20px;height:20px;accent-color:var(--primary)}

/* question screen */
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.qcard{display:flex;flex-direction:column;gap:16px}
.q{font-size:22px;font-weight:700;line-height:1.6}
.fillq .blank{display:inline-block;min-width:80px;border-bottom:2px solid var(--primary);margin:0 6px}
.big{font-family:var(--f-q);font-size:30px;line-height:2;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.kind{font-size:13px;color:var(--muted)}
.verse{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;text-align:center;font-family:var(--f-q);font-size:27px;line-height:2.2}
.vw{font:inherit;background:none;border:none;padding:0 4px;border-radius:8px;color:inherit;display:inline}
button.vw{border-bottom:2px dotted var(--line-strong);border-radius:6px;margin:2px 0}
.vw.hl,.mhl{color:var(--primary);background:var(--primary-soft);border-radius:8px}
.vw.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.vw.right{background:var(--good-soft);color:var(--good-ink);outline:2px solid var(--good)}
.vw.wrong{background:var(--bad-soft);color:var(--bad-ink);outline:2px solid var(--bad)}
.vw.missed{outline:2px dashed var(--good);color:var(--good-ink)}
.vref{font-family:var(--f-ui);font-size:13px;color:var(--muted);white-space:nowrap}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.tf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.four{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{width:100%;min-height:56px;padding:12px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:10px;font-weight:600;text-align:start;line-height:1.6}
.opt .ot{flex-grow:1}
.opt .om{display:flex;width:22px;height:22px;flex-shrink:0}
.opt .om svg{width:22px;height:22px}
.opt[aria-pressed="true"]{background:var(--primary-soft);border:2px solid var(--primary);color:var(--primary)}
.opt.right{background:var(--good-soft);border:2px solid var(--good);color:var(--good-ink)}
.opt.wrong{background:var(--bad-soft);border:2px solid var(--bad);color:var(--bad-ink)}
.opt.missed{border:2px dashed var(--good)}
.opt:disabled{cursor:default;opacity:1}
.opt.ar,.tok.ar{font-family:var(--f-q);font-size:22px;font-weight:400}
.prop{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:12px;padding:10px 14px}
.prop small{font-size:13px;color:var(--muted)}
.follow{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.mq,.ma{display:flex;flex-direction:column;gap:8px}
.mqi,.mai{display:flex;align-items:center;gap:10px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:52px;font-weight:500}
.mqi.sel{border:2px solid var(--primary);background:var(--primary-soft)}
.mai.set{border-color:var(--primary)}
.mai.right{background:var(--good-soft);border:2px solid var(--good)}
.mai.wrong{background:var(--bad-soft);border:2px solid var(--bad)}
.num{min-width:28px;height:28px;border-radius:8px;background:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--primary);flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tok{background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:6px 14px;min-height:44px;font-weight:600}
.tok.sel{border:2px solid var(--primary);background:var(--primary-soft)}
.tok.right{background:var(--good-soft);border-color:var(--good)} .tok.wrong{background:var(--bad-soft);border-color:var(--bad)}
.seq{margin:0;padding-inline-start:24px;display:flex;flex-direction:column;gap:6px;min-height:20px}
.seq li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.seq li.right{background:var(--good-soft);border-color:var(--good)} .seq li.wrong{background:var(--bad-soft);border-color:var(--bad)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.bin{border:1px dashed var(--line-strong);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:96px;background:var(--surface)}
.binh{background:var(--primary-soft);color:var(--primary);border:none;border-radius:10px;min-height:44px;font-weight:700}
.binw{display:flex;flex-wrap:wrap;gap:6px}
.review{display:flex;flex-direction:column;gap:8px}
.review .it{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.arw{font-family:var(--f-q);font-size:20px}
.timer{position:relative;height:28px;border-radius:999px;background:var(--accent-soft);overflow:hidden;display:flex;align-items:center;justify-content:center}
.timer i{position:absolute;inset-block:0;inset-inline-start:0;width:100%;background:var(--accent);opacity:.35}
.timer span{position:relative;font-weight:700;color:var(--accent-ink);font-size:13px}
.bookimg{margin:0;display:flex;flex-direction:column;gap:4px;align-items:center}
.bookimg img{width:100%;max-width:380px;border-radius:14px;border:1px solid var(--line);background:#fff}
.bookimg figcaption{font-size:13px;color:var(--muted)}
.fbe{line-height:1.7}
.score{font-size:40px;font-weight:700;color:var(--primary);line-height:1.2}
.end{align-items:flex-start}
.end .rz-badge .ic{width:14px;height:14px}

/* notebook & mastery */
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:4px;display:inline-block}
.dot.good,.mas.good{background:var(--good-soft);border-color:var(--good)}
.dot.good{background:var(--good)}
.dot.review{background:var(--accent)}
.dot.none{background:var(--line-strong)}
.mas-row{display:flex;flex-wrap:wrap;gap:8px}
.mas{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--muted);text-decoration:none;font-size:15px}
.mas.good{color:var(--good-ink);border:1px solid var(--good)}
.mas.review{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.mas small{font-size:12px;opacity:.85}

/* riddles, listen, hearts, combo, share */
.riddle-h{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}
.riddle-h .ic{width:16px;height:16px}
.listen{display:inline-flex;align-items:center;gap:4px;vertical-align:middle;font-family:var(--f-ui);font-size:13px;font-weight:600;border:1px solid var(--line-strong);background:var(--bg);color:var(--primary);border-radius:999px;padding:2px 10px;min-height:32px}
.listen svg{width:18px;height:18px}
.listen.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.hearts{display:inline-flex;gap:2px;color:var(--bad)}
.hearts .ic{width:18px;height:18px} .hearts .ic.off{color:var(--line-strong)}
.combo{display:inline-flex;align-items:center;gap:4px;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.combo .ic{width:14px;height:14px}
.qshare{width:36px;height:36px;border-radius:10px;border:none;background:none;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.qshare svg{width:20px;height:20px} .qshare:hover{background:var(--primary-soft);color:var(--primary)}
.rz-tile.gold{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

/* lesson path */
.pathsec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.pathsec.gold{border-color:var(--accent);background:linear-gradient(var(--surface),var(--accent-soft))}
.path{display:flex;flex-direction:column;gap:4px;padding:4px 0}
.pnode{display:grid;grid-template-columns:56px minmax(0,1fr);column-gap:12px;align-items:center;border:none;background:none;text-align:start;padding:6px 0;margin-inline-start:calc(var(--x) * 18%);min-height:64px;color:var(--ink)}
.pnode .disc{width:56px;height:56px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;background:var(--primary);color:var(--primary-ink);box-shadow:0 4px 0 var(--primary-dark)}
.pnode .disc svg{width:22px;height:22px}
.pnode .pl{display:block;font-weight:600;line-height:1.5}
.pnode .stars{font-size:13px;margin:0}
.pnode .disc{grid-row:span 2}
.pnode.locked .disc{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line-strong)}
.pnode.locked .pl{color:var(--muted)}
.pnode.crown .disc{background:var(--accent);color:var(--on-accent);box-shadow:0 4px 0 #A88B68}
.pnode.cur .disc{outline:4px solid var(--accent-soft);outline-offset:3px}
.pnode.final .disc{background:var(--surface);border:2px dashed var(--accent);box-shadow:none;font-size:24px}

@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .25s ease-out}
  .shake{animation:shake .35s}
  @keyframes pop{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
  @keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
}
</style>
</head><body data-nav="tests">
<main class="rz-main" id="app"><p class="rz-empty">جاري التحميل…</p></main>
<script src="data.js"></script>
<script src="riddles.js"></script>
<script src="engine.js"></script>
</body></html>
