<style>
/* Layout: a single column "card table". Home = four ascending steps (levels); play = one question card with a progress rail. */
:root{
  --bg:#F4EFE4; --surface:#FFFDF8; --ink:#231A1C; --muted:#6B5F5C; --line:#E2D8C6;
  --maroon:#7A1F33; --maroon-ink:#FFFFFF; --saffron:#D9982A; --saffron-soft:#F6E6C3;
  --good:#1E7A4F; --good-soft:#DDF1E6; --bad:#B3261E; --bad-soft:#F8DEDB;
  --s1:#3F7D5A; --s2:#C08A1E; --s3:#B5532A; --s4:#7A1F33;
  --display:"Amiri",serif; --body:"IBM Plex Sans Arabic",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17120F; --surface:#221B18; --ink:#F1E9DF; --muted:#B4A89E; --line:#3A302A;
  --maroon:#E07A8E; --maroon-ink:#1C1210; --saffron:#EDB654; --saffron-soft:#3A2E17;
  --good:#5CCB92; --good-soft:#163527; --bad:#F08A80; --bad-soft:#3D1D1A;
  --s1:#6FC293; --s2:#E8B550; --s3:#EE8E62; --s4:#E07A8E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17120F; --surface:#221B18; --ink:#F1E9DF; --muted:#B4A89E; --line:#3A302A;
  --maroon:#E07A8E; --maroon-ink:#1C1210; --saffron:#EDB654; --saffron-soft:#3A2E17;
  --good:#5CCB92; --good-soft:#163527; --bad:#F08A80; --bad-soft:#3D1D1A;
  --s1:#6FC293; --s2:#E8B550; --s3:#EE8E62; --s4:#E07A8E; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
button{font-family:var(--body);cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.6px;color:var(--saffron)}
h1{margin:0;font-family:var(--display);font-size:clamp(44px,9vw,68px);line-height:1.1;color:var(--maroon);text-wrap:balance}
h2{margin:0;font-family:var(--display);font-size:30px;line-height:1.3;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:56ch}
/* home: steps */
.steps{display:flex;flex-direction:column-reverse;gap:10px}
.step{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;text-align:start;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;margin-inline-start:calc(var(--i) * 6%);min-height:76px}
.step:not([disabled]):hover{border-color:var(--c)}
.step[disabled]{opacity:.55;cursor:not-allowed}
.step .n{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--c);color:var(--surface);font-family:var(--display);font-size:26px;font-weight:700}
.step .t{display:flex;flex-direction:column;min-width:0}
.step .t b{font-size:18px}
.step .t span{font-size:13px;color:var(--muted)}
.stars{font-size:18px;letter-spacing:2px;color:var(--saffron);white-space:nowrap}
.stars .off{color:var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ghost{background:none;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;min-height:40px}
.how{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-size:14px;color:var(--muted)}
.how ul{margin:6px 0 0;padding-inline-start:20px}
/* play */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip.lv{background:var(--c);color:var(--surface);border-color:var(--c)}
.rail{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rail i{height:6px;border-radius:3px;background:var(--line)}
.rail i.ok{background:var(--good)} .rail i.no{background:var(--bad)} .rail i.now{background:var(--saffron)}
.timer{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--saffron);width:100%;transform-origin:right}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px}
.kind{font-size:13px;font-weight:700;color:var(--muted)}
.q{font-size:21px;font-weight:600;line-height:1.7;text-wrap:pretty}
.big{font-family:var(--display);font-size:clamp(40px,10vw,64px);line-height:1.25;text-align:center;color:var(--maroon);padding:6px 0;background:var(--saffron-soft);border-radius:12px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:17px;font-weight:600;text-align:start;min-height:54px;line-height:1.5}
.opt.ar{font-family:var(--display);font-size:24px;text-align:center}
.opt:not([disabled]):hover{border-color:var(--maroon)}
.opt[aria-pressed="true"]{border-color:var(--maroon);background:var(--saffron-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.missed{border-style:dashed;border-color:var(--good)}
.opt[disabled]{cursor:default}
.primary{background:var(--maroon);color:var(--maroon-ink);border:0;border-radius:12px;padding:12px 22px;font-size:17px;font-weight:700;min-height:50px}
.primary[disabled]{opacity:.45;cursor:not-allowed}
.fb{border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.8}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb b{display:block;font-size:16px}
.fb small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
/* end */
.score{font-family:var(--display);font-size:64px;line-height:1;color:var(--maroon);font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:10px}
.review .it{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface);font-size:14px}
.review .it b{color:var(--good)}
.review .it s{color:var(--bad);text-decoration-thickness:1.5px}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.01)}100%{transform:none}}
.shake{animation:sh .35s ease}
@keyframes sh{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.pop,.shake{animation:none}}

.lvl{display:flex;flex-direction:column;gap:12px}
.lvh{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.lvh h2{color:var(--c)}
.lvh .ghost{margin-inline-start:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.chap{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:start;background:var(--surface);border:1.5px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:14px 16px;min-height:120px}
.chap:hover{border-color:var(--c)}
.chap .bab{font-size:12px;font-weight:700;color:var(--c)}
.chap b{font-size:17px;line-height:1.5}
.chap .meta{font-size:13px;color:var(--muted);margin-top:auto}
.ttl{font-size:14px;font-weight:700;color:var(--muted)}
.chip.d1{color:var(--s1)} .chip.d2{color:var(--s2)} .chip.d3{color:var(--s3)}
.wrap{max-width:900px}
/* mixed question types */
.prop{display:flex;flex-direction:column;gap:2px;background:var(--saffron-soft);border-radius:12px;padding:10px 14px}
.prop small{color:var(--muted);font-size:13px}.prop b{font-size:19px}
.opts.tf{grid-template-columns:1fr 1fr}
.opts.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.follow{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.verse{font-family:"Amiri Quran","Amiri",serif;font-size:clamp(24px,6vw,30px);line-height:2.3;background:var(--bg);border-radius:12px;padding:8px 12px;text-align:justify}
.vw{font:inherit;color:inherit;background:none;border:1.5px solid transparent;border-radius:8px;padding:0 3px;line-height:1.9}
button.vw{border-color:var(--line);background:var(--surface);margin:2px 0}
.vw.hl{background:var(--saffron-soft);border-color:var(--saffron)}
.vw.on{border-color:var(--maroon);background:var(--saffron-soft)}
.vw.right,.tok.right,.mai.right,.seq li.right{border-color:var(--good);background:var(--good-soft)}
.vw.wrong,.tok.wrong,.mai.wrong,.seq li.wrong{border-color:var(--bad);background:var(--bad-soft)}
.vw.missed{border-style:dashed;border-color:var(--good)}
.vref{font-family:var(--body);font-size:13px;color:var(--muted);white-space:nowrap}
.mq,.ma{display:flex;flex-direction:column;gap:8px}
.mqi,.mai{display:flex;gap:10px;align-items:flex-start;text-align:start;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px;font-weight:600;min-height:48px;line-height:1.6}
.mqi.sel{border-color:var(--maroon);box-shadow:0 0 0 2px var(--saffron-soft)}
.mai.set{background:var(--surface)}
.num{flex:none;min-width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--maroon);color:var(--maroon-ink);font-weight:700;font-size:14px}
.mai .num:empty{background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tok{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;font-size:16px;font-weight:600;min-height:44px}
.tok.ar,.arw{font-family:"Amiri Quran","Amiri",serif;font-size:22px;font-weight:400}
.tok.sel{border-color:var(--maroon);background:var(--saffron-soft)}
.seq{margin:0;padding-inline-start:26px;display:flex;flex-direction:column;gap:6px;min-height:20px}
.seq li{border:1.5px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:600}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bin{border:1.5px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:110px}
.binh{border:0;background:var(--maroon);color:var(--maroon-ink);border-radius:10px;padding:8px;font-weight:700;font-size:15px;min-height:44px}
.binw{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:560px){.opts.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mhl{color:#C2410C;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:10px}
@media (prefers-color-scheme:dark){.mhl{color:#FDBA74}}
/* custom exam builder */
.custom{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;text-align:start;border:2px solid var(--maroon);background:var(--saffron-soft);border-radius:16px;padding:14px 16px;min-height:76px;margin-top:6px}
.custom .ci{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--maroon);color:var(--maroon-ink);font-size:22px}
.custom .t{display:flex;flex-direction:column;min-width:0}.custom .t b{font-size:19px;color:var(--maroon)}.custom .t span{font-size:13.5px;color:var(--muted)}
.custom .arr{font-size:22px;color:var(--maroon)}
select.sel{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:48px;width:100%}
.tree{display:flex;flex-direction:column;gap:8px}
.tl{border:1.5px solid var(--line);border-inline-start:5px solid var(--c);border-radius:12px;background:var(--bg)}
.tl summary{cursor:pointer;padding:10px 14px;font-weight:700;color:var(--c);min-height:44px;display:flex;align-items:center}
.tc{display:flex;flex-direction:column;gap:2px;padding:4px 12px 10px}
.tch{display:flex;gap:10px;align-items:center;font-weight:700;padding:6px 0;border-top:1px dashed var(--line)}
.tlsn{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0 5px;padding-inline-start:26px;font-size:15px}
.tlsn small{color:var(--muted);font-size:12.5px}
.tree input{width:20px;height:20px;accent-color:var(--maroon)}
.ghost[aria-pressed="true"]{border-color:var(--maroon);background:var(--saffron-soft);color:var(--maroon)}
</style>

        cb.addEventListener('change',()=>{ cb.checked?sel.add(key):sel.delete(key); refresh(); });
        const nq=LESSONS[id].t.filter(x=>x===li).length;
        ch.append(el('label',{class:'tlsn'},cb,el('span',{},n),el('small',{},AR(nq)))); });
      sec.append(ch);
    });
    secs.push({sec,L});
    tree.append(sec);
  });
  const nRow=el('div',{class:'row'},el('span',{class:'ttl'},'عدد الأسئلة:'));
  [10,20,30].forEach(n=>nRow.append(el('button',{type:'button',class:'ghost','aria-pressed':String(CUS.n===n),on:{click:e=>{CUS.n=n;csave();nRow.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===e.currentTarget)));}}},AR(n))));
  go.addEventListener('click',()=>{ const {pool,spec}=customPool(); start({id:'custom',title:'اختباري: '+AR(CUS.sel.length)+' دروس',pool,spec,n:CUS.n}); });
  app.append(
    el('div',{class:'bar'},el('button',{type:'button',class:'ghost',on:{click:home}},'→ المكتبة')),
    el('header',{style:'display:flex;flex-direction:column;gap:6px'},el('div',{class:'eyebrow'},'اختبار على مقاسك'),el('h1',{style:'font-size:clamp(36px,8vw,52px)'},'صمّم اختبارك'),
      el('p',{class:'lead'},'اختر الدروس التي أخذتها مع أستاذك، أو اختر آخر درس وصلت إليه وسنحدد كل ما قبله تلقائياً.')),
    el('section',{class:'card',style:'gap:10px'},el('b',{},'وصلت مع أستاذي إلى:'),upto),
    el('section',{class:'card',style:'gap:10px'},el('b',{},'أو اختر الدروس بنفسك:'),tree,
      el('div',{class:'row'},el('button',{type:'button',class:'ghost',on:{click:()=>{sel.clear();refresh();}}},'إلغاء الكل'))),
    el('section',{class:'card',style:'gap:12px'},nRow,el('div',{class:'row'},count),go));
  refresh();
}

const DL={1:'سهل',2:'متوسط',3:'صعب'};
function verseBox(q,onTap){
  const box=el('div',{class:'verse'});
  q.v.forEach((w,i)=>{
    const sp=el(onTap?'button':'span',{type:onTap?'button':null,class:'vw'+(q.hl&&q.hl.includes(i)&&!q.parts?' hl':'')},
      q.parts&&q.hl&&q.hl[0]===i?q.parts.map(([t,h])=>h?el('span',{class:'mhl'},t):t):w);
    if(onTap) sp.addEventListener('click',()=>onTap(i,sp));
    box.append(sp,' ');
  });
  box.append(el('span',{class:'vref'},q.ref?'('+q.ref.replace(/\d+/g,d=>AR(d))+')':''));
  return box;
}
function render(){
  const q=S.qs[S.i]; S.done=false; app.innerHTML='';
  const rail=el('div',{class:'rail','aria-hidden':'true',style:`grid-template-columns:repeat(${Math.min(S.qs.length,10)},1fr)`}); for(let k=0;k<S.qs.length;k++) rail.append(el('i',{class:k<S.res.length?(S.res[k].ok?'ok':'no'):k===S.i?'now':''}));
  app.append(el('div',{class:'bar'},
      el('button',{type:'button',class:'ghost',on:{click:home}},'→ المكتبة'),
      el('div',{class:'row'},el('span',{class:'chip'},`السؤال ${AR(S.i+1)} من ${AR(S.qs.length)}`),el('span',{class:'chip d'+q.d},DL[q.d]),el('span',{class:'chip'},`⭐ ${AR(S.score)}`),S.streak>=2?el('span',{class:'chip'},`🔥 ${AR(S.streak)}`):'')),
    el('div',{class:'ttl'},S.T.title), rail);
  const card=el('section',{class:'card pop'});
  card.append(el('div',{class:'kind'},KIND[q.type]));
  const fb=el('div',{}); S.ui={card,fb};
  (R[q.type])(q,card);
  card.append(fb); app.append(card);
}
function checkBtn(card,fn,label){ const b=el('button',{type:'button',class:'primary',on:{click:()=>{ if(!S.done) fn(); }}},label||'تحقّق'); card.append(el('div',{class:'row'},b)); S.ui.check=b; return b; }
const R={
  mcq(q,card){ card.append(el('div',{class:'q'},q.q)); if(q.big) card.append(el('div',{class:'big'},q.big)); optsMCQ(q,card,false); },
  vmcq(q,card){ card.append(el('div',{class:'q'},q.q)); card.append(verseBox(q)); optsMCQ(q,card,false); },
  tf(q,card){
    card.append(el('div',{class:'q'},q.q)); if(q.big) card.append(el('div',{class:'big'},q.big));
    card.append(el('div',{class:'prop'},el('small',{},'الإجابة المقترحة'),el('b',{},q.prop)));
    const row=el('div',{class:'opts tf'});
    const yes=el('button',{type:'button',class:'opt'},'✓ صح'), no=el('button',{type:'button',class:'opt'},'✗ خطأ');
    yes.onclick=()=>{ if(S.done)return; yes.disabled=no.disabled=true; if(q.right){yes.classList.add('right');finish(true,'صح')} else {yes.classList.add('wrong');no.classList.add('missed');finish(false,'صح')} };
    no.onclick=()=>{ if(S.done)return; yes.disabled=no.disabled=true;
      if(q.right){ no.classList.add('wrong'); yes.classList.add('missed'); finish(false,'خطأ'); return; }
      no.classList.add('right');
      const box=el('div',{class:'follow'},el('div',{class:'kind'},'أحسنت، العبارة خاطئة. فما الإجابة الصحيحة؟'));
      const o=el('div',{class:'opts'});
      q.opts.filter(x=>x!==q.prop).forEach(x=>o.append(el('button',{type:'button',class:'opt',on:{click:()=>{ if(S.done)return; [...o.children].forEach(b=>{b.disabled=true; if(b.textContent===q.ans)b.classList.add('right'); else if(b.textContent===x)b.classList.add('wrong');}); finish(x===q.ans,x); }}},x)));
      box.append(o); card.insertBefore(box,S.ui.fb);
    };
    row.append(yes,no); card.append(row);
  },
  match(q,card){
    card.append(el('div',{class:'q'},'اضغط على السؤال، ثم على جوابه.'));
    const nums='١٢٣٤'; let cur=0; const asg={}; // answer -> question index
    const ql=el('div',{class:'mq'}), al=el('div',{class:'ma'});
    const qb=q.pairs.map((p,i)=>el('button',{type:'button',class:'mqi',on:{click:()=>{cur=i;paint()}}},el('span',{class:'num'},nums[i]),el('span',{},p.q)));
    const answers=shuffle(q.pairs.map(p=>p.a));
    const ab=answers.map(a=>el('button',{type:'button',class:'mai',on:{click:()=>{ if(S.done)return; for(const k in asg) if(asg[k]===cur) delete asg[k]; asg[a]=cur; const nxt=q.pairs.findIndex((p,i)=>!Object.values(asg).includes(i)); if(nxt>=0)cur=nxt; paint(); }}},el('span',{class:'num'},''),el('span',{},a)));
    function paint(){ qb.forEach((b,i)=>b.classList.toggle('sel',i===cur&&!S.done)); ab.forEach((b,k)=>{const v=asg[answers[k]]; b.querySelector('.num').textContent=v!=null?nums[v]:''; b.classList.toggle('set',v!=null)}); S.ui.check&&(S.ui.check.disabled=Object.keys(asg).length<q.pairs.length); }
    ql.append(...qb); al.append(...ab); card.append(ql,el('div',{class:'kind'},'الأجوبة'),al);
    checkBtn(card,()=>{ let ok=true; ab.forEach((b,k)=>{ const a=answers[k]; const good=q.pairs[asg[a]]?.a===a; b.classList.add(good?'right':'wrong'); if(!good)ok=false; b.disabled=true; }); qb.forEach(b=>b.disabled=true);
      if(!ok){ S.ui.fb.append(el('div',{class:'review'},...q.pairs.map((p,i)=>el('div',{class:'it'},nums[i]+'. '+p.q+' ← ',el('b',{},p.a))))); }
      finish(ok,ok?'':'توصيل غير مكتمل'); });
    paint();
  },
  order(q,card){
    card.append(el('div',{class:'q'},q.q.replace(/^ما\s+/,'').replace(/؟$/,'')+':'),el('div',{class:'kind'},'اضغط على العناصر بالترتيب'));
    const seq=[]; const pool=shuffle(q.items.map((t,i)=>({t,i})));
    const out=el('ol',{class:'seq'}), src=el('div',{class:'chips'});
    const btns=pool.map(o=>el('button',{type:'button',class:'tok',on:{click:()=>{ if(S.done)return; seq.push(o); paint(); }}},o.t));
    const reset=el('button',{type:'button',class:'ghost',on:{click:()=>{ if(S.done)return; seq.length=0; paint(); }}},'إعادة');
    function paint(){ out.innerHTML=''; seq.forEach(o=>out.append(el('li',{},o.t))); btns.forEach((b,k)=>b.hidden=seq.includes(pool[k])); S.ui.check&&(S.ui.check.disabled=seq.length<q.items.length); }
    src.append(...btns); card.append(src,out,el('div',{class:'row'},reset));
    checkBtn(card,()=>{ const ok=seq.every((o,k)=>o.t===q.items[k]); [...out.children].forEach((li,k)=>li.classList.add(seq[k].t===q.items[k]?'right':'wrong')); reset.disabled=true; finish(ok,seq.map(o=>o.t).join('، ')); });
    paint();
  },
  pick(q,card){
    card.append(el('div',{class:'q'},q.q));
    const sel=new Set(); let box;
    box=verseBox(q,(i,b)=>{ if(S.done)return; sel.has(i)?sel.delete(i):sel.add(i); b.classList.toggle('on'); S.ui.check.disabled=!sel.size; });
    card.append(box,el('div',{class:'kind',style:'font-weight:500'},'اضغط مرة أخرى لإلغاء الاختيار. الحكم الواحد بين كلمتين يكفي فيه اختيار إحداهما.'));
    checkBtn(card,()=>{ const all=new Set(q.g.flat()); const ok=q.g.every(g=>g.some(i=>sel.has(i)))&&[...sel].every(i=>all.has(i));
      [...box.querySelectorAll('.vw')].forEach((b,i)=>{ b.disabled=true; if(all.has(i)) b.classList.add(sel.has(i)?'right':'missed'); else if(sel.has(i)) b.classList.add('wrong'); });
      finish(ok,[...sel].map(i=>q.v[i]).join('، ')); }).disabled=true;
  },
  multi(q,card){
    card.append(el('div',{class:'q'},q.q),verseBox(q));
    const sel=new Set(); const o=el('div',{class:'opts four'});
    const bs=q.opts.map(x=>el('button',{type:'button',class:'opt ar','aria-pressed':'false',on:{click:e=>{ if(S.done)return; sel.has(x)?sel.delete(x):sel.add(x); e.currentTarget.setAttribute('aria-pressed',String(sel.has(x))); S.ui.check.disabled=!sel.size; }}},x));
    o.append(...bs); card.append(o);
    checkBtn(card,()=>{ const ok=q.set.length===sel.size&&q.set.every(x=>sel.has(x));
      bs.forEach((b,k)=>{ const x=q.opts[k]; b.disabled=true; if(q.set.includes(x)) b.classList.add(sel.has(x)?'right':'missed'); else if(sel.has(x)) b.classList.add('wrong'); });
      finish(ok,[...sel].join('، ')); }).disabled=true;
  },
  sort(q,card){
    card.append(el('div',{class:'q'},q.q));
    let cur=null; const asg=new Map();
    const words=q.it.map((it,k)=>el('button',{type:'button',class:'tok ar',on:{click:()=>{ if(S.done)return; cur=k; paint(); }}},it.w));
    const bins=q.b.map((b,bi)=>{ const box=el('div',{class:'bin'}); const head=el('button',{type:'button',class:'binh',on:{click:()=>{ if(S.done||cur==null)return; asg.set(cur,bi); const nx=q.it.findIndex((_,k)=>!asg.has(k)); cur=nx>=0?nx:null; paint(); }}},b); box.append(head,el('div',{class:'binw'})); return box; });
    const wrap=el('div',{class:'chips'}), binsW=el('div',{class:'bins'},...bins);
    function paint(){ wrap.innerHTML=''; bins.forEach(b=>b.querySelector('.binw').innerHTML='');
      words.forEach((w,k)=>{ w.classList.toggle('sel',k===cur); if(asg.has(k)) bins[asg.get(k)].querySelector('.binw').append(w); else wrap.append(w); });
      S.ui.check&&(S.ui.check.disabled=asg.size<q.it.length); }
    card.append(el('div',{class:'kind'},'الكلمات'),wrap,binsW);
    cur=0;
    checkBtn(card,()=>{ let ok=true; words.forEach((w,k)=>{ w.disabled=true; const good=asg.get(k)===q.it[k].b; w.classList.add(good?'right':'wrong'); if(!good){ok=false;} });
      bins.forEach(b=>b.querySelector('.binh').disabled=true);
      if(!ok) S.ui.fb.append(el('div',{class:'review'},...q.it.filter((it,k)=>asg.get(k)!==it.b).map(it=>el('div',{class:'it'},el('span',{class:'arw'},it.w),' ← ',el('b',{},q.b[it.b]),it.e?el('div',{style:'color:var(--muted)'},it.e):''))));
      finish(ok,''); });
    paint();
  }
};
function optsMCQ(q,card){
  const opts=el('div',{class:'opts'});
  q.opts.forEach(o=>opts.append(el('button',{type:'button',class:'opt',on:{click:()=>{ if(S.done)return; [...opts.children].forEach(b=>{ b.disabled=true; if(b.textContent===q.ans) b.classList.add('right'); else if(b.textContent===o) b.classList.add('wrong'); }); finish(o===q.ans,o); }}},o)));
  card.append(opts);
}
function finish(ok,sel){
  if(S.done) return; S.done=true; const q=S.qs[S.i]; if(S.ui.check) S.ui.check.disabled=true;
  let gain=0;
  if(ok){ S.right++; S.streak++; S.best=Math.max(S.best,S.streak); gain=q.d*10+5*Math.min(S.streak-1,5); S.score+=gain; }
  else { S.streak=0; S.ui.card.classList.remove('pop'); void S.ui.card.offsetWidth; S.ui.card.classList.add('shake'); }
  S.res.push({ok,q,sel});
  const last=S.i===S.qs.length-1;
  const showAns=!ok&&!['match','sort'].includes(q.type);
  S.ui.fb.append(el('div',{class:'fb '+(ok?'ok':'no')},el('b',{},ok?`إجابة صحيحة! +${AR(gain)}`:'إجابة غير صحيحة'),
      showAns?el('span',{},`الإجابة الصحيحة: ${q.ans}. `):'', el('span',{},q.e||'')),
    el('div',{class:'row',style:'margin-top:12px'},el('button',{type:'button',class:'primary',on:{click:()=>{ if(last) end(); else { S.i++; render(); scrollTo(0,0); } }}},last?'النتيجة':'السؤال التالي ←')));
  S.ui.fb.querySelector('.primary:last-of-type')?.focus({preventScroll:true});
}
function end(){
  const n=S.qs.length, r=S.right, f=r/n, stars=f>=1?3:f>=.9?2:f>=.7?1:0, id=S.T.id;
  save.best[id]=Math.max(save.best[id]||0,r); save.stars[id]=Math.max(save.stars[id]||0,stars); persist();
  app.innerHTML='';
  app.append(el('section',{class:'card pop',style:'align-items:flex-start'},
    el('div',{class:'eyebrow'},S.T.title),
    el('div',{class:'score'},`${AR(r)} من ${AR(n)}`), starStr(stars),
    el('p',{style:'margin:0'}, r===n?'ما شاء الله، علامة كاملة!':f>=.7?'أحسنت! أتقنت معظم الباب.':'راجع أخطاءك في الأسفل، ثم أعد الاختبار؛ ستظهر لك أسئلة جديدة.'),
    el('p',{style:'margin:0;color:var(--muted)'},`النقاط: ${AR(S.score)} · أطول سلسلة صحيحة: ${AR(S.best)}`),
    el('div',{class:'row'},el('button',{type:'button',class:'primary',on:{click:()=>start(S.T)}},'أعد الاختبار'),el('button',{type:'button',class:'ghost',on:{click:home}},'المكتبة'),S.T.id==='custom'?el('button',{type:'button',class:'ghost',on:{click:builder}},'تعديل الدروس'):'')));
  const wrong=S.res.filter(x=>!x.ok);
  if(wrong.length){ const rv=el('div',{class:'review'},el('h2',{},'راجع أخطاءك'));
    wrong.forEach(x=>{ const q=x.q;
      const title=q.type==='match'?'توصيل':q.type==='sort'?q.q:(q.q+(q.big?` ${q.big}`:'')+(q.v?` ﴿${q.v.join(' ')}﴾`:''));
      rv.append(el('div',{class:'it'},el('div',{style:'font-weight:600'},el('span',{class:'chip',style:'margin-inline-end:6px'},KIND[q.type]),title),
        el('div',{},x.sel?el('s',{},x.sel):'',x.sel?' ':'',el('b',{},'← '+q.ans)), q.e?el('div',{style:'color:var(--muted)'},q.e):''));});
    app.append(rv); }
  scrollTo(0,0);
}
home();
})();
