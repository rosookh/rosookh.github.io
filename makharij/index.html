<!doctype html>
<html lang="ar">
<head>

<style>
/* Layout: stage (anatomy) beside a reading panel; letter keys grouped by makhraj region below. */
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --ink:#1E2B28; --muted:#55605C; --line:#DCD8CE;
  --accent:#1F5C4A; --gold:#B8862E;
  --skin:#F1D3C2; --skin-line:#B98872; --air:#FBF7F2; --bone:#E9DFC9; --bone-line:#A8946A;
  --tongue:#D9827B; --tongue-line:#9E4E48; --tooth:#FFFFFF; --tooth-line:#9C8A66;
  --jawf:#8A6A22; --halq:#8E3B1F; --lisan:#1F5C4A; --shafa:#1D4E6B; --khay:#5B2C4F;
  --display:"Amiri",serif; --body:"IBM Plex Sans Arabic",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1C2320; --ink:#EDEAE2; --muted:#A9B0AB; --line:#323B37;
  --accent:#6CC3A4; --gold:#E0B460;
  --skin:#5A4339; --skin-line:#9C7462; --air:#232A27; --bone:#6E644F; --bone-line:#A8946A;
  --tongue:#C46F68; --tongue-line:#F0A9A2; --tooth:#ECE8DF; --tooth-line:#8F8264;
  --jawf:#E0B460; --halq:#F08E68; --lisan:#6CC3A4; --shafa:#7FB6DA; --khay:#D79BC6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1C2320; --ink:#EDEAE2; --muted:#A9B0AB; --line:#323B37;
  --accent:#6CC3A4; --gold:#E0B460;
  --skin:#5A4339; --skin-line:#9C7462; --air:#232A27; --bone:#6E644F; --bone-line:#A8946A;
  --tongue:#C46F68; --tongue-line:#F0A9A2; --tooth:#ECE8DF; --tooth-line:#8F8264;
  --jawf:#E0B460; --halq:#F08E68; --lisan:#6CC3A4; --shafa:#7FB6DA; --khay:#D79BC6;
  color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 32px}
.eyebrow{font-size:14px;font-weight:600;letter-spacing:.5px;color:var(--gold)}
h1{margin:0;font-family:var(--display);font-size:clamp(40px,6vw,60px);line-height:1.15;color:var(--accent);text-wrap:balance}
header p{margin:0;max-width:46ch;color:var(--muted)}
.main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;position:relative}
.stage svg{display:block;width:100%;height:auto;direction:ltr}
.bookview{position:relative;aspect-ratio:1/1;background:#fff;border-radius:12px;overflow:hidden;direction:ltr}
.bookview[hidden]{display:none}
.try b{display:block;margin-bottom:2px}.try small{display:block;opacity:.75;margin-top:4px}
.bookview img,.bookview video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:top;opacity:0;transition:opacity .3s ease;background:#fff}
.bookview video{pointer-events:none}.bookview video.on{opacity:1}
.bookview img.on{opacity:1}
@media (prefers-reduced-motion:reduce){.bookview img,.bookview video{transition:none}}
.bkcap{position:absolute;inset-inline:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(to top,rgba(255,255,255,.96) 60%,rgba(255,255,255,0));color:#1E2B28;direction:rtl}
.bkcap b{font-family:var(--display);font-size:30px;line-height:1.2;color:#1F5C4A}
.bkcap span{font-size:13px;font-weight:600;color:#55605C}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink);padding:6px 16px;min-height:40px;font-size:15px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
#svg[hidden]{display:none}
.stage .bar{display:flex;flex-wrap:wrap;gap:8px;padding:6px 8px 4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.region{font-size:14px;font-weight:600;color:var(--muted)}
.num{min-width:46px;height:46px;border-radius:999px;display:grid;place-items:center;font-weight:700;font-size:20px;color:var(--surface);background:var(--c,var(--accent))}
.pname{font-size:24px;font-weight:700;line-height:1.4;color:var(--c,var(--accent));text-wrap:balance}
.pletters{font-family:var(--display);font-size:46px;font-weight:700;line-height:1.3}
.box{background:var(--bg);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.box b{font-size:13px;color:var(--gold)}
.box span{font-weight:600}
.book{font-size:16px;color:var(--ink)}
.book small{display:block;color:var(--muted);font-size:13px}
.try{font-size:16px;line-height:1.75}
.sound{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px}
.sound b{font-size:13px;color:var(--gold);width:100%}
.sound .pill{font-size:15px}
.sound .src{font-size:12px;color:var(--muted);width:100%}
.sound video{width:100%;border-radius:8px;background:#000;aspect-ratio:16/9}
.sound.empty{color:var(--muted);font-size:14px}
.vid{font-size:14px;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
button{font-family:var(--body);cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pill{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 16px;min-height:40px;font-size:15px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.vowels{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vowels[hidden]{display:none!important}
.vowels .v{font-family:var(--display);font-size:26px;min-width:64px;padding:2px 14px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.grp h3{margin:0;font-size:14px;font-weight:700;color:var(--gc)}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.k{font-family:var(--display);font-size:26px;font-weight:700;min-width:48px;min-height:48px;border-radius:10px;border:2px solid var(--gc);background:var(--surface);color:var(--ink);line-height:1;padding:4px 8px}
.k.sm{font-family:var(--body);font-size:14px}
.k[aria-pressed="true"]{background:var(--gc);color:var(--surface)}
.lb2{font-family:var(--body);font-size:14px;font-weight:700}
.lbl{font-family:var(--body);font-size:13px;font-weight:600;fill:var(--muted)}
@media (prefers-reduced-motion:reduce){.pulse{animation:none!important}}
.pulse{animation:pl 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.95}50%{opacity:.45}}
.flow{stroke-dasharray:6 8;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-28}}
.apptop{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.apptop .back svg{width:24px;height:24px}.apptop .back{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink);text-decoration:none;font-size:22px}
.tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:14px;flex-grow:1;max-width:420px}
.tabs a{flex:1;text-align:center;padding:8px 6px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px}
.tabs a[aria-current]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08)}
</style>

</head>

<div class="wrap" dir="rtl">

<header>

  <p>اختر حرفًا لترى اللسان ينتقل من وضع السكون إلى مخرج الحرف.</p>
</header>

      </defs>
      <!-- head -->
      <path fill="url(#gSkin)" d="M215,120 C190,160 130,200 86,222 Q64,232 72,247 Q80,259 104,256 Q112,266 118,282 L176,296 L184,440 L176,524 C230,540 290,550 318,575 C330,610 334,650 336,690 L660,690 L660,120 Z"/>

      <text x="589" y="640" text-anchor="middle" class="lb2" fill="#E6E2FF" transform="rotate(-90 589 640)">الحلق</text>

    <div class="bar">

 edges:'طرف اللسان مع أطراف الثنايا العليا.',lip:'باطن الشفة السفلى مع أطراف الثنايا العليا.',lower:'المخرج فُويق الثنايا السفلى، لا في سقف الفم. والصفير يخرج من الفراغ بين الثنايا العليا والسفلى.',
 uvula:'أدنى الحلق: جذر اللسان مع الحنك اللحمي واللهاة.',none:'هذا المخرج ليس في سقف الفم.'};
const TEETH=[['ثنية',7.6],['رباعية',6.2],['ناب',6.8],['ضاحك',7.2],['طاحن',9],['طاحن',9],['طاحن',9.2],['ناجذ',8.4]];
const ARCH=(()=>{ // sample the outer arch: quarter ellipse then straight
  const cx=120,cy=150,rx=84,ry=118, pts=[]; let d=0, prev=[cx,cy-ry];
  for(let a=-Math.PI/2;a<=0;a+=0.004){ const q=[cx+rx*Math.cos(a),cy+ry*Math.sin(a)]; d+=Math.hypot(q[0]-prev[0],q[1]-prev[1]); pts.push([d,q,a]); prev=q; }
  for(let y=cy;y<=200;y+=0.5){ const q=[cx+rx,y]; d+=Math.hypot(q[0]-prev[0],q[1]-prev[1]); pts.push([d,q,0]); prev=q; }
  const at=dist=>{ for(const p of pts) if(p[0]>=dist) return p; return pts[pts.length-1]; };
  const teeth=[]; let dist=0;
  TEETH.forEach(([n,r],i)=>{ dist+= (i?TEETH[i-1][1]:0)+r+0.8; const p=at(dist); teeth.push({n,r,x:p[1][0],y:p[1][1],a:p[2]}); });
  return {cx,cy,rx,ry,teeth};
})();
function drawArch(k){
  const z=ZONE[k]||'none', {cx,cy,rx,ry,teeth}=ARCH, HL='#36D1FF', HS='#0A6E8F';
  const arc=(r1,r2,a1,a2)=>{ let d=''; for(let a=a1;a<=a2+1e-9;a+=(a2-a1)/24){ const x=cx+r1*Math.cos(a),y=cy+r2*Math.sin(a); d+=(d?'L':'M')+x.toFixed(1)+','+y.toFixed(1);} return d; };
  const deg=x=>x*Math.PI/180;
  let g='';
  // soft palate + uvula (behind the molars)
  g+=`<path d="M${cx-rx+18},166 L${cx+rx-18},166 L${cx+rx-22},190 Q${cx},204 ${cx-rx+22},190 Z" fill="${z==='soft'||z==='uvula'?'#9FE3FF':'#E9B3BA'}" stroke="#B9707A"/>`;
  g+=`<ellipse cx="${cx}" cy="204" rx="6" ry="9" fill="${z==='uvula'?HL:'#D98C96'}" stroke="${z==='uvula'?HS:'#9E4E58'}"/>`;
  // hard palate (inside the arch)
  g+=`<path d="${arc(rx-18,ry-18,deg(-180),0)} L${cx+rx-18},166 L${cx-rx+18},166 Z" fill="#F2C9CE" stroke="#C98A93"/>`;
  // kaf band
  g+=`<rect x="${cx-rx+18}" y="152" width="${2*(rx-18)}" height="14" fill="${z==='kaf'?HL:'#DCEFD0'}" opacity="${z==='kaf'?1:.9}"/>`;
  // rugae (al-ghar / nit')
  for(let i=0;i<4;i++){ const y=64+i*9; g+=`<path d="M${cx-22+i*2},${y} q6,-5 11,0 q5,5 11,0 q5,-5 11,0" fill="none" stroke="#B9707A" stroke-width="1.3"/>`; }
  if(z==='hard') g+=`<ellipse cx="${cx}" cy="118" rx="30" ry="28" fill="${HL}" opacity=".85" stroke="${HS}"/>`;
  // gums (inner band of the teeth)
  g+=`<path d="${arc(rx-9,ry-9,deg(-180),0)}" fill="none" stroke="#EE8F9B" stroke-width="7"/>`;
  const t3=teeth[3].a;
  if(z==='lam') g+=`<path d="${arc(rx-9,ry-9,deg(-180)-t3-0.1,t3+0.1)}" fill="none" stroke="${HL}" stroke-width="7"/>`;
  if(z==='gumN') g+=`<path d="${arc(rx-9,ry-9,deg(-98),deg(-82))}" fill="none" stroke="${HL}" stroke-width="7"/>`;
  if(z==='gumR') g+=`<path d="${arc(rx-17,ry-17,deg(-98),deg(-82))}" fill="none" stroke="${HL}" stroke-width="7"/>`;
  // teeth both sides
  teeth.forEach((t,i)=>{ [1,-1].forEach(sd=>{ const x=cx+sd*(t.x-cx); const on=(z==='molars'&&i>=3)||((z==='edges'||z==='lip'||z==='roots')&&i===0);
    g+=`<circle cx="${x.toFixed(1)}" cy="${t.y.toFixed(1)}" r="${t.r}" fill="${on&&z==='molars'?HL:'#FFFFFF'}" stroke="${on?HS:'#9A9584'}" stroke-width="${on?2:1}"/>`; }); });
  if(z==='molars') [1,-1].forEach(sd=>{ const a1=teeth[3].a,a2=0; let d=''; for(let a=a1;a<=a2;a+=(a2-a1)/16){ const x=cx+sd*((rx-11)*Math.cos(a)), y=cy+(ry-11)*Math.sin(a); d+=(d?'L':'M')+x.toFixed(1)+','+y.toFixed(1);} d+=`L${(cx+sd*(rx-11)).toFixed(1)},${teeth[7].y.toFixed(1)}`; g+=`<path d="${d}" fill="none" stroke="${HL}" stroke-width="6" stroke-linecap="round"/>`; });
  if(z==='roots') g+=`<path d="${arc(rx-4,ry-4,deg(-97),deg(-83))}" fill="none" stroke="${HL}" stroke-width="4" stroke-linecap="round"/>`;
  if(z==='edges'||z==='lip') g+=`<path d="${arc(rx+7,ry+7,deg(-97),deg(-83))}" fill="none" stroke="${HL}" stroke-width="4" stroke-linecap="round"/>`;
  // labels
  const L=(x,y,t,a='middle')=>`<text x="${x}" y="${y}" text-anchor="${a}" font-family="IBM Plex Sans Arabic, sans-serif" font-size="8.5" font-weight="700" fill="#4A3A2A">${t}</text>`;
  g+=L(cx,12,'الثنايا')+L(cx,58,'اللثة')+L(cx,104,'الغار (النِّطع)')+L(cx,128,'الحنك العظمي')+L(cx,162,'منطقة الكاف')+L(cx,184,'الحنك اللحمي');
  g+=L(cx+10,214,'اللهاة','start');
  g+=L(teeth[3].x+12, teeth[3].y+3,'الضاحك','start')+L(teeth[7].x+11, teeth[7].y+3,'الناجذ','start');
  $('arch').innerHTML=g;
  $('archNote').textContent=ZNOTE[z];
}
$('partsBtn').addEventListener('click',()=>{ const on=$('partsBtn').getAttribute('aria-pressed')!=='true'; $('partsBtn').setAttribute('aria-pressed',on?'true':'false'); $('palParts').setAttribute('opacity',on?'1':'0'); });
draw(cur);
setView('book');

addEventListener('hashchange',()=>{ const h=decodeURIComponent(location.hash.slice(1)); if(spec(h)) pick(h); });
})();
</script>
